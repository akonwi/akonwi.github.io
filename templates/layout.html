<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>@@title@@</title>
  <meta name="description" content="@@description@@" />
  <link rel="canonical" href="@@canonical_url@@" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/mica.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/syntax.css" />
  <script>
    if (window.location.hostname !== "localhost") {
      var _gaq = window._gaq || [];
      _gaq.push(["_setAccount", "UA-47544457-1"]);
      _gaq.push(["_trackPageview"]);
      (function() {
        var ga = document.createElement("script");
        ga.type = "text/javascript";
        ga.async = true;
        ga.src = ("https:" === document.location.protocol ? "https://ssl" : "http://www") + ".google-analytics.com/ga.js";
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(ga, s);
      })();
    }
  </script>
</head>
<body>
  <m-center class="container">
    <header class="site-header">
      <a class="wordmark" href="/">akonwi</a>
      <nav aria-label="Primary navigation">
        <a href="/" @@current_blog@@>blog</a>
        <a href="/about/" @@current_about@@>about</a>
        <a href="/projects/" @@current_projects@@>projects</a>
        <a href="https://github.com/akonwi" target="_blank" rel="noreferrer">github</a>
      </nav>
    </header>
    <main class="content">
      @@content@@
    </main>
    <footer class="site-footer">
      <p>© akonwi · notes on software + life</p>
    </footer>
  </m-center>
</body>
</html>
