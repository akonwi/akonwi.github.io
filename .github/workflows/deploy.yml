name: Deploy site to GitHub Pages

env:
  ARD_VERSION: v0.36.0

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install Ard
        run: |
          curl -fsSL -o /tmp/ard.tar.gz \
            "https://github.com/akonwi/ard/releases/download/${ARD_VERSION}/ard_${ARD_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/ard.tar.gz -C /tmp
          sudo install /tmp/ard /usr/local/bin/ard

      - name: Verify Ard compiler
        run: test "$(ard version)" = "$ARD_VERSION"

      - name: Build site
        run: ard run site.ard

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
